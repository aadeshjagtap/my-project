namespace: chat-app

backend:
  image: imadesh/chatapp-backend
  tag: v2
  replicas: 1
  port: 5001
  nodePort: 30501
  resources:
    limits:
      memory: "512Mi"
      cpu: "500m"
    requests:
      memory: "256Mi"
      cpu: "250m"
  hpa:
    minReplicas: 1
    maxReplicas: 5
    cpuUtilization: 70

frontend:
  image: imadesh/chatapp-frontend
  tag: v2
  replicas: 1
  port: 80
  nodePort: 30080
  resources:
    limits:
      memory: "256Mi"
      cpu: "200m"
    requests:
      memory: "128Mi"
      cpu: "100m"
  hpa:
    minReplicas: 1
    maxReplicas: 3
    cpuUtilization: 70

mongodb:
  image: mongo
  tag: 7.0
  port: 27017
  username: root
  password: admin
  storage: 1Gi

