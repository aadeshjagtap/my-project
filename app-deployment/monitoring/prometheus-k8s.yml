apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: chat-app
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - "/etc/prometheus/alert-rules.yml"
    alerting:
      alertmanagers:
        - static_configs:
            - targets: ["alertmanager:9093"]
    scrape_configs:
      - job_name: "prometheus"
        static_configs:
          - targets: ["prometheus:9090"]
      - job_name: "chat-backend"
        static_configs:
          - targets: ["backend:5001"]
      - job_name: "kube-state-metrics"
        static_configs:
          - targets: ["kube-state-metrics.chat-app.svc.cluster.local:8080"]
      - job_name: "kubernetes-pods"
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace]
            action: keep
            regex: chat-app
  alert-rules.yml: |
    groups:
      - name: chat-app-alerts
        rules:
          - alert: PodDown
            expr: up{job="chat-backend"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Pod is down"
              description: "Backend pod has been down for more than 1 minute."
          - alert: HighCPUUsage
            expr: rate(process_cpu_seconds_total{job="chat-backend"}[1m]) * 100 > 80
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "High CPU usage detected"
              description: "CPU usage is above 80% for more than 2 minutes."
          - alert: HighMemoryUsage
            expr: process_resident_memory_bytes{job="chat-backend"} / 1024 / 1024 > 400
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "High memory usage"
              description: "Memory usage is above 400MB for more than 2 minutes."
          - alert: HPAMaxReplicasReached
            expr: kube_horizontalpodautoscaler_status_current_replicas == kube_horizontalpodautoscaler_spec_max_replicas
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "HPA reached maximum replicas"
              description: "HPA has reached max replicas - cluster may need more capacity."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: chat-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:latest
        ports:
        - containerPort: 9090
        volumeMounts:
        - name: prometheus-config
          mountPath: /etc/prometheus
      volumes:
      - name: prometheus-config
        configMap:
          name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: chat-app
spec:
  selector:
    app: prometheus
  ports:
    - protocol: TCP
      port: 9090
      targetPort: 9090
      nodePort: 30900
  type: NodePort
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: chat-app
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'severity']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'slack-notifications'
    receivers:
      - name: 'slack-notifications'
        slack_configs:
          - api_url: 'https://hooks.slack.com/services/YOUR_WEBHOOK_URL'
            channel: '#alerts'
            title: 'Alert: {{ .GroupLabels.alertname }}'
            text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
            send_resolved: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: chat-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      containers:
      - name: alertmanager
        image: prom/alertmanager:latest
        ports:
        - containerPort: 9093
        volumeMounts:
        - name: alertmanager-config
          mountPath: /etc/alertmanager
        args:
          - '--config.file=/etc/alertmanager/alertmanager.yml'
      volumes:
      - name: alertmanager-config
        configMap:
          name: alertmanager-config
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: chat-app
spec:
  selector:
    app: alertmanager
  ports:
    - protocol: TCP
      port: 9093
      targetPort: 9093
      nodePort: 30903
  type: NodePort
